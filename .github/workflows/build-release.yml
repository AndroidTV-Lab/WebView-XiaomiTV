name: Build and Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Date only, in the maintainers' timezone, so a release is easy to identify on the TV.
          DATE="$(TZ=Asia/Shanghai date +'%Y.%m.%d')"
          CODE="$(TZ=Asia/Shanghai date +'%Y%m%d')"
          echo "name=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$DATE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $DATE (versionCode $CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK/build-tools" ]; then
            echo "::error::Android SDK build-tools not found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "build-tools:"
          ls "$SDK/build-tools"
          echo "platforms:"
          ls "$SDK/platforms"

      - name: Ensure Android SDK 36
        run: |
          set -euo pipefail
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "::error::sdkmanager not found at $SDKMANAGER"
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is required: the installer must keep a stable signature across releases."
            exit 1
          fi
          if [ -z "${KEYSTORE_PASS:-}" ]; then
            echo "::error::KEYSTORE_PASS is required."
            exit 1
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/thorium-overlay.jks
          test -s keystore/thorium-overlay.jks

      - name: Build overlay
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-31/android.jar"
          if [ ! -f "$ANDROID_JAR" ]; then
            ANDROID_JAR="$(find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)/android.jar"
          fi
          KS_PASS="${KEYSTORE_PASS:-android}"
          KS_ALIAS="${KEY_ALIAS:-thorium-overlay}"

          mkdir -p out/work
          echo "==> aapt2 compile"
          "$BT/aapt2" compile --dir overlay/res -o out/work/resources.zip
          echo "==> aapt2 link"
          "$BT/aapt2" link -o out/work/unsigned.apk -I "$ANDROID_JAR" \
            --manifest overlay/AndroidManifest.xml -R out/work/resources.zip --auto-add-overlay
          echo "==> zipalign"
          "$BT/zipalign" -p -f 4 out/work/unsigned.apk out/work/aligned.apk
          echo "==> apksigner sign"
          "$BT/apksigner" sign --ks keystore/thorium-overlay.jks \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --out out/WebViewOverlay.apk out/work/aligned.apk
          echo "==> apksigner verify"
          "$BT/apksigner" verify --print-certs out/WebViewOverlay.apk

          cd out
          sha256sum WebViewOverlay.apk > WebViewOverlay.apk.sha256
          cat WebViewOverlay.apk.sha256

      - name: Verify overlay contents
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          PKG="$("$BT/aapt2" dump packagename out/WebViewOverlay.apk)"
          echo "package: $PKG"
          test "$PKG" = "com.android.webviewoverlay"

          "$BT/aapt2" dump xmltree --file AndroidManifest.xml out/WebViewOverlay.apk | tee manifest.txt
          grep -q 'targetPackage' manifest.txt
          grep -q 'isStatic' manifest.txt
          grep -q 'priority' manifest.txt

          "$BT/aapt2" dump xmltree --file res/xml/config_webview_packages.xml out/WebViewOverlay.apk | tee providers.txt
          # The first provider must be Thorium; Google stays selectable but must not be a
          # fallback, or system_server disables it (enabled=3) whenever another valid
          # provider is installed.
          grep -m1 'packageName' providers.txt | grep -q 'com.thorium.webview'
          grep -q 'org.axpos.aosmium_wv' providers.txt
          grep -q 'com.google.android.webview' providers.txt
          ! grep -q 'isFallback' providers.txt
          # Beta/dev/canary/debug Google packages are retired: only the stable package remains.
          ! grep -qE 'com\.google\.android\.webview\.' providers.txt

          # Thorium and Google accept both the vendor-signed stock build and the patched build
          # signed with the project key, so the certificate that signed this overlay must appear
          # once per family. Compare against the APK's own signer instead of re-exporting the
          # keystore, so the check tracks exactly what will be deployed.
          SIGNER_SHA="$("$BT/apksigner" verify --print-certs out/WebViewOverlay.apk \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr 'A-F' 'a-f')"
          test -n "$SIGNER_SHA"
          COUNT=0
          while IFS= read -r CERT; do
            CERT_SHA="$(printf '%s' "$CERT" | base64 -d | sha256sum | cut -d' ' -f1)"
            if [ "$CERT_SHA" = "$SIGNER_SHA" ]; then
              COUNT=$((COUNT + 1))
            fi
          done < <(sed -n "s/^ *T: '\(.*\)'\$/\1/p" providers.txt)
          echo "project certificate occurrences: $COUNT"
          test "$COUNT" -eq 2

      - name: Bundle overlay into installer
        run: |
          set -euo pipefail
          # The installer deploys its own copy; the release APK is only an archive. The bundled
          # asset is therefore the freshly signed one from this run, not a stale file in the repo.
          mkdir -p installer/app/src/main/assets
          cp out/WebViewOverlay.apk installer/app/src/main/assets/WebViewOverlay.apk
          sha256sum installer/app/src/main/assets/WebViewOverlay.apk

      - name: Build installer
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/thorium-overlay.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x installer/gradlew
          cd installer
          ./gradlew --no-daemon --stacktrace assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          cp "$APK" ../out/WebViewInstaller.apk

      - name: Verify installer
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          PKG="$("$BT/aapt2" dump packagename out/WebViewInstaller.apk)"
          echo "package: $PKG"
          test "$PKG" = "com.androidtvlab.xiaomi.webviewinstaller"
          "$BT/apksigner" verify --print-certs out/WebViewInstaller.apk
          # The overlay must actually be embedded: that copy is what gets deployed.
          unzip -l out/WebViewInstaller.apk | grep -q 'assets/WebViewOverlay.apk'
          cd out
          sha256sum WebViewInstaller.apk > WebViewInstaller.apk.sha256
          cat WebViewInstaller.apk.sha256

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: WebViewTools
          path: |
            out/WebViewOverlay.apk
            out/WebViewOverlay.apk.sha256
            out/WebViewInstaller.apk
            out/WebViewInstaller.apk.sha256
          if-no-files-found: error

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WebView Tools ${{ steps.version.outputs.name }}
          body: |
            Dated build `${{ steps.version.outputs.name }}` (versionCode `${{ steps.version.outputs.code }}`, run `${{ github.run_number }}`).

            The installer carries the overlay inside its APK and deploys that bundled copy.
            The standalone overlay archive is published to the `webview-assets` release.

            - `WebViewInstaller.apk` — TV installer (package `com.androidtvlab.xiaomi.webviewinstaller`)
            - `.sha256` — verify with `sha256sum -c` or the installer itself
          files: |
            out/WebViewInstaller.apk
            out/WebViewInstaller.apk.sha256
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload overlay to webview-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The overlay archive lives in the long-lived assets release consumed by tooling,
          # not in the dated latest release. The installer still embeds its own copy.
          if ! gh release view webview-assets --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create webview-assets --repo "$GITHUB_REPOSITORY" \
              --title "WebView Assets" \
              --notes "Long-lived assets release. WebView APKs and manifest.json are maintained manually; CI refreshes WebViewOverlay.apk and its checksum."
          fi
          gh release upload webview-assets --repo "$GITHUB_REPOSITORY" \
            out/WebViewOverlay.apk \
            out/WebViewOverlay.apk.sha256 \
            --clobber

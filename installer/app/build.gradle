plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def envVersionCode = System.getenv("VERSION_CODE")
def envVersionName = System.getenv("VERSION_NAME")
def envKeystore = System.getenv("KEYSTORE_PATH")

android {
    namespace = "com.tvlaunchers.webviewinstaller"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.tvlaunchers.webviewinstaller"
        minSdk = 28
        targetSdk = 28
        versionCode = envVersionCode ? envVersionCode.toInteger() : 1
        versionName = envVersionName ?: "1.0.0"
    }

    signingConfigs {
        release {
            if (envKeystore) {
                storeFile = file(envKeystore)
                storePassword = System.getenv("KEYSTORE_PASS") ?: "android"
                keyAlias = System.getenv("KEY_ALIAS") ?: "thorium-overlay"
                keyPassword = System.getenv("KEYSTORE_PASS") ?: "android"
            }
        }
    }

    buildTypes {
        release {
            // R8 strips the unused Compose/Kotlin classes; the app uses no reflection, so the
            // library consumer rules shipped with Compose and coroutines are sufficient.
            minifyEnabled = true
            shrinkResources = true
            if (envKeystore) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    packagingOptions {
        resources.excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        // AGP stores DEX uncompressed when minSdk >= 28. Compress it: the APK is roughly
        // halved, at the cost of extracting the dex once at install time.
        dex {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.1"

    implementation platform("androidx.compose:compose-bom:2026.02.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.tv:tv-material:1.1.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
}
